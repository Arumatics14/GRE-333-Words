 return `<div class=row>${T.map(t=>`<button class="${qt==t[0]?'on':''}" onclick="qt='${t[0]}';nq();R()">${t[1]}</button>`).join('')}</div>
 <div class=card style="min-height:0;cursor:default">${qq.pr}</div>`+qq.o.map((x,n)=>`<button class="opt ${qq.sel!=null?(x==qq.c?'ok':n==qq.sel?'no':''):''}" onclick="ans(${n})">${cp(x)}</button>`).join('')+
 (qq.sel!=null?`<p>${qq.d.w}: ${bn?qq.d.b:''}</p>${SA(qq.d)}<button class="pri opt" onclick="nq();R()">পরের প্রশ্ন →</button>`:'')}
function LI(q){q=q.toLowerCase();return P().filter(d=>d.w.toLowerCase().includes(q)||d.b.includes(q)).map(d=>`<div class=it><b>${known.has(d.w)?'✓ ':''}${d.v?'★ ':''}${d.w}</b>${bn?` — <span style="color:var(--ac)">${d.b}</span>`:''}${SA(d)}</div>`).join('')}
function LS(v){$('#ls').innerHTML=LI(v)}
function L(){return `<input placeholder="খুঁজুন…" oninput="LS(this.value)"><div id=ls>${LI('')}</div>`}
function R(){
 const pl=P(),kn=pl.filter(d=>known.has(d.w)).length;$('#pg').innerHTML=`<b>${kn}/${pl.length}</b> শেখা · কুইজ সঠিক ${st.t?Math.round(st.r/st.t*100):0}% (${st.r}/${st.t}) <button style="padding:2px 8px;font-size:12px" onclick="known=new Set();st={r:0,t:0};save();mk();R()">রিসেট</button><div class=bar><i style="width:${Math.round(kn/pl.length*100)}%"></i></div>`;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#gr').innerHTML=[['v','★ গুরুত্বপূর্ণ'],['o','অন্যান্য'],['a','সব']].map(g=>`<button class="${grp==g[0]?'gs':''}" onclick="setG('${g[0]}')">${g[1]}</button>`).join('');
 $('#m').innerHTML=tab=='c'?C():tab=='q'?Q():L()}
mk();R();
</script></body></html>
